name: Smoke Test

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  smoke-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        architecture: [x64]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ===== LINUX BUILD ENVIRONMENT =====
      - name: Set up build environment (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential

      # ===== WINDOWS BUILD ENVIRONMENT =====
      - name: Set up build environment (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-binutils
            mingw-w64-x86_64-dlfcn
            make

      # ===== BUILD LIBRARY (LINUX) =====
      - name: Build library (Linux)
        if: runner.os == 'Linux'
        working-directory: ${{ github.workspace }}/build/unix
        run: make -f x86_64_linux.mk

      # ===== BUILD LIBRARY (WINDOWS) =====
      - name: Build library (Windows)
        if: runner.os == 'Windows'
        working-directory: ${{ github.workspace }}/build/windows/MinGW64
        shell: msys2 {0}
        run: |
          # Override hardcoded MINGW path with MSYS2's actual MinGW location
          MINGW_PATH=$(cygpath -m /mingw64)
          GCC_VERSION=$(gcc -dumpversion)
          make MINGW="$MINGW_PATH" MINREL="$GCC_VERSION"

      # ===== BUILD LOOPBACK TEST (LINUX) =====
      - name: Build loopback test (Linux)
        if: runner.os == 'Linux'
        working-directory: ${{ github.workspace }}/examples/cpp/x86_64-linux
        run: make

      # ===== BUILD LOOPBACK TEST (WINDOWS) =====
      - name: Build loopback test (Windows)
        if: runner.os == 'Windows'
        working-directory: ${{ github.workspace }}/examples/cpp/win64
        shell: msys2 {0}
        run: make

      # ===== RUN LOOPBACK TEST (LINUX) =====
      - name: Run Linux loopback test
        if: runner.os == 'Linux'
        working-directory: ${{ github.workspace }}/examples/cpp/x86_64-linux
        run: |
          timeout 60 ./loopback_test || echo "Loopback test completed or timed out"

      # ===== RUN LOOPBACK TEST (WINDOWS) =====
      - name: Run Windows loopback test
        if: runner.os == 'Windows'
        working-directory: ${{ github.workspace }}/examples/cpp/win64
        shell: msys2 {0}
        run: |
          timeout 60 ./loopback_test.exe || echo "Loopback test completed or timed out"
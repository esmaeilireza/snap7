name: Cross-Platform Build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        architecture: [x64]
        include:
          - os: ubuntu-latest
            architecture: x64
            makefile: build/unix/x86_64_linux.mk
            target: libsnap7.so
          - os: windows-latest
            architecture: x64
            makefile: build/windows/MinGW64/Makefile
            target: snap7.dll
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up build environment (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential

      - name: Set up build environment (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: mingw-w64-x86_64-gcc mingw-w64-x86_64-binutils make

      - name: Build (Linux)
        if: runner.os == 'Linux'
        working-directory: ${{ github.workspace }}
        run: |
          make -f ${{ matrix.makefile }}
          ls -la build/bin/x86_64-linux/

      - name: Build (Windows)
        if: runner.os == 'Windows'
        working-directory: ${{ github.workspace }}/build/windows/MinGW64
        shell: msys2 {0}
        run: |
          make
          ls -la ../../bin/Legacy/win64/

      - name: Upload Linux artifact
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: snap7-linux-x64
          path: build/bin/x86_64-linux/libsnap7.so

      - name: Upload Windows artifact
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: snap7-windows-x64
          path: build/bin/Legacy/win64/snap7.dll